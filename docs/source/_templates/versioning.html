{% if versions %}
<div class="sidebar-version-selector">
<!--    <label for="version-select">{{ project }} Version</label>-->

    <select id="version-select"
            onchange="window.location.href = this.value">
        {% for item in versions | reverse %}
        <option value="{{ item.url }}"
                {% if item.name == current_version.name %}
                selected
                {% endif %}>
            {{ item.name }}
        </option>
        {% endfor %}
    </select>
</div>

<div class="versioning">
    <a href="../index.html" class="docs-home">
        ← Docs Home
    </a>

    {% if versions %}
    <!-- Existing version selector -->
    {% endif %}
</div>
{% endif %}
